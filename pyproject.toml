[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tl-parser"
version = "0.7.12b1"
description = "Fast HTML parser for Python written in Rust"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Martín Gaitán", email = "gaitan@gmail.com" }]
keywords = ["html", "parser", "rust", "bindings"]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/mgaitan/tl-parser"
Repository = "https://github.com/mgaitan/tl-parser"
Issues = "https://github.com/mgaitan/tl-parser/issues"
Changelog = "https://github.com/mgaitan/tl-parser/releases"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "tl"
python-packages = ["tl"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C90",
    "A",
    "ANN",
    "UP",
    "RUF",
    "T10",
    "ISC",
    "SIM",
    "ASYNC",
    "ERA",
    "TRY",
    "BLE",
    "B",
    "EXE",
    "FA",
    "C4",
    "N",
    "PIE",
    "PERF",
    "PL",
    "FURB",
    "RET",
    "TID252",
]

[tool.ruff.lint.per-file-ignores]
"python/tests/**.py" = ["ANN201"]
"python/tl/__init__.py" = ["F403", "F405"]

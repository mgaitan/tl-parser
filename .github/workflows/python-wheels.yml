name: Build Python Wheels

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform.name }} (Py ${{ matrix.python }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        platform:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: 2_34
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: off
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            manylinux: off
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            manylinux: off
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up CPython ${{ matrix.python }}
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel (${{ matrix.platform.name }}, Py ${{ matrix.python }})
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -F python --out dist --interpreter python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.platform.name }}-py${{ matrix.python }}-wheels
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Attach wheels to release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: wheelhouse
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/**/*.whl
